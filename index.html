  <!-- EL PROBLEMA -->
  <section id="problema" class="section">
    <div class="section-inner">
      <h2 data-es="Dejar que una IA proponga asientos" data-en="Letting an AI propose accounting entries"></h2>
      <p data-es="En contabilidad un error no se queda en el borrador: un asiento descuadrado, una cuenta equivocada o un IVA mal aplicado acaban en el libro diario, que es el registro oficial de la contabilidad. Antes de dejar que una IA proponga asientos hacía falta responder a una pregunta concreta:" data-en="In accounting an error does not stay in the draft: an unbalanced entry, a wrong account or misapplied VAT ends up in the general ledger, the official record of the accounts. Before letting an AI propose entries, one specific question had to be answered:"></p>
      <blockquote data-es="&ldquo;¿Cuánto acierta y en qué falla exactamente?&rdquo;" data-en="&ldquo;How often is it right, and where exactly does it fail?&rdquo;"></blockquote>
      <p data-es="La respuesta tenía que ser un número que se pudiera repetir, con el detalle de cada caso. Todo se mide sobre la contabilidad de TechAcces SL, una empresa ficticia con cuatro ejercicios de datos sintéticos en una base MySQL privada." data-en="The answer had to be a repeatable number, with the detail of each case. Everything is measured on the books of TechAcces SL, a fictitious company with four financial years of synthetic data in a private MySQL database."></p>
      <div class="callout" data-es="El punto de partida fue &lt;a href='https://github.com/jleonceo/llm-eval-contable' style='color: var(--accent2); text-decoration: underline;'&gt;llm-eval-contable&lt;/a&gt;, la evaluación de una sola skill contable. De ahí salió el sistema de agentes." data-en="The starting point was &lt;a href='https://github.com/jleonceo/llm-eval-contable' style='color: var(--accent2); text-decoration: underline;'&gt;llm-eval-contable&lt;/a&gt;, the evaluation of a single accounting skill. The agent system grew out of it."></div>
    </div>
  </section>

  <!-- CÓMO TRABAJA -->
  <section id="arquitectura" class="section section-dark">
    <div class="section-inner">
      <h2 data-es="Cómo se reparte el trabajo" data-en="How the work is split"></h2>
      <p data-es="Un documento recorre cuatro agentes, y una persona aprueba el asiento antes de que llegue al libro diario, que es el registro oficial de la contabilidad:" data-en="A document goes through four agents, and a person approves the entry before it reaches the general ledger, the official record of the accounts:"></p>

      <div class="pipeline">
        <div class="pipe-step">
          <div class="pipe-icon">📄</div>
          <div class="pipe-label" data-es="Extractor" data-en="Extractor"></div>
          <div class="pipe-desc" data-es="Lee el documento original, sea factura, nómina o recibo, y devuelve sus datos." data-en="Reads the original document, whether invoice, payslip or receipt, and returns its data."></div>
        </div>
        <div class="pipe-arrow">→</div>
        <div class="pipe-step">
          <div class="pipe-icon">⚖️</div>
          <div class="pipe-label" data-es="Generador" data-en="Generator"></div>
          <div class="pipe-desc" data-es="Propone el asiento a partir de esos datos, sin ver el documento." data-en="Proposes the entry from that data, without seeing the document."></div>
        </div>
        <div class="pipe-arrow">→</div>
        <div class="pipe-step">
          <div class="pipe-icon">✓</div>
          <div class="pipe-label" data-es="Verificador" data-en="Verifier"></div>
          <div class="pipe-desc" data-es="Revisa el asiento sin saber quién lo propuso y sin ninguna herramienta de escritura." data-en="Reviews the entry without knowing who proposed it and without any writing tool."></div>
        </div>
        <div class="pipe-arrow">→</div>
        <div class="pipe-step">
          <div class="pipe-icon">✎</div>
          <div class="pipe-label" data-es="Escribano" data-en="Writer"></div>
          <div class="pipe-desc" data-es="Guarda el asiento aprobado en una tabla de borradores. El paso al libro diario lo decide una persona." data-en="Saves the approved entry to a drafts table. A person decides when it moves to the ledger."></div>
        </div>
      </div>

      <p data-es="El quinto agente, el &lt;strong&gt;punteador&lt;/strong&gt;, trabaja aparte, sobre la conciliación bancaria. Un motor sin IA casa cada movimiento del banco con su asiento, y cuando encuentra dos opciones que cuadran igual, el punteador estudia la duda. Si no puede resolverla, la deja para una persona." data-en="The fifth agent, the &lt;strong&gt;matcher&lt;/strong&gt;, works separately, on bank reconciliation. An engine without AI matches each bank movement with its entry, and when it finds two options that fit equally well, the matcher studies the doubt. If it cannot resolve it, it leaves it for a person."></p>
    </div>
  </section>

  <!-- CONTROLES -->
  <section id="controles" class="section">
    <div class="section-inner">
      <h2 data-es="Cada agente, solo lo que necesita" data-en="Each agent, only what it needs"></h2>
      <p data-es="Los permisos se reparten para que ningún agente pueda hacer el trabajo de otro. Cada uno recibe solo estas herramientas:" data-en="Permissions are split so that no agent can do another agent's job. Each one gets only these tools:"></p>

      <div class="axes-grid">
        <div class="axis">
          <div class="axis-name" data-es="Extractor" data-en="Extractor"></div>
          <div class="axis-desc" data-es="Leer y buscar ficheros. Es el único que ve el documento original. No toca la base de datos." data-en="Read and search files. It is the only one that sees the original document. It does not touch the database."></div>
        </div>
        <div class="axis">
          <div class="axis-name" data-es="Generador" data-en="Generator"></div>
          <div class="axis-desc" data-es="Leer y buscar ficheros, buscar la cuenta contable y consultar saldos. No escribe en ninguna tabla." data-en="Read and search files, look up the ledger account and check account balances. It writes to no table."></div>
        </div>
        <div class="axis">
          <div class="axis-name" data-es="Verificador" data-en="Verifier"></div>
          <div class="axis-desc" data-es="Leer y buscar ficheros, comprobar el cuadre, buscar duplicados y consultar saldos. No tiene ninguna herramienta de escritura." data-en="Read and search files, check that the entry balances, look for duplicates and check account balances. It has no writing tool at all."></div>
        </div>
        <div class="axis">
          <div class="axis-name" data-es="Escribano" data-en="Writer"></div>
          <div class="axis-desc" data-es="Leer ficheros, comprobar el cuadre, buscar duplicados y escribir el borrador. Es el único que escribe, y solo en la tabla de borradores." data-en="Read files, check that the entry balances, look for duplicates and write the draft. It is the only one that writes, and only to the drafts table."></div>
        </div>
        <div class="axis">
          <div class="axis-name" data-es="Punteador" data-en="Matcher"></div>
          <div class="axis-desc" data-es="Leer y buscar ficheros y consultar saldos. Estudia las dudas de la conciliación sin escribir." data-en="Read and search files and check account balances. It studies the reconciliation doubts without writing."></div>
        </div>
      </div>

      <p data-es="Hay tres controles más, por debajo de los agentes:" data-en="There are three more controls, underneath the agents:"></p>
      <div class="lessons">
        <div class="lesson">
          <div class="lesson-run" data-es="La base de datos pone su propio límite" data-en="The database sets its own limit"></div>
          <div class="lesson-text" data-es="El usuario con el que entran los agentes solo puede escribir en las tablas de borradores. Si alguien intenta escribir en el libro diario o borrar un registro, la base de datos lo rechaza, aunque falle todo lo demás." data-en="The user the agents connect with can only write to the drafts tables. If anyone tries to write to the ledger or delete a record, the database refuses, even if everything else fails."></div>
        </div>
        <div class="lesson">
          <div class="lesson-run" data-es="Una persona decide" data-en="A person decides"></div>
          <div class="lesson-text" data-es="Ningún asiento pasa de la tabla de borradores al libro diario sin que lo apruebe una persona." data-en="No entry moves from the drafts table to the ledger without a person approving it."></div>
        </div>
        <div class="lesson">
          <div class="lesson-run" data-es="El criterio está escrito" data-en="The criteria are written down"></div>
          <div class="lesson-text" data-es="El criterio contable está en documentos de consulta que el agente abre antes de decidir: asientos tipo de la empresa, una biblioteca de asientos del Plan General Contable y el catálogo de clientes, proveedores y empleados." data-en="The accounting criteria are in reference documents the agent opens before deciding: the company's standard entries, a library of entries under the Spanish General Accounting Plan and the catalogue of customers, suppliers and employees."></div>
        </div>
        <div class="lesson">
          <div class="lesson-run" data-es="Las fichas están publicadas" data-en="The agent sheets are published"></div>
          <div class="lesson-text" data-es="La ficha de cada agente, con su lista de herramientas tal como la recibe, está en la carpeta &lt;a href='https://github.com/jleonceo/accounting-agent-swarm/tree/main/agentes' style='color: var(--accent2); text-decoration: underline;'&gt;agentes&lt;/a&gt; del repositorio." data-en="Each agent's sheet, with its tool list exactly as it receives it, is in the repository's &lt;a href='https://github.com/jleonceo/accounting-agent-swarm/tree/main/agentes' style='color: var(--accent2); text-decoration: underline;'&gt;agentes&lt;/a&gt; folder."></div>
        </div>
      </div>
    </div>
  </section>

  <!-- CÓMO SE MIDE -->
  <section id="eval" class="section section-dark">
    <div class="section-inner">
      <h2 data-es="Medir antes de confiar" data-en="Measure before trusting"></h2>
      <p data-es="El examen de julio tiene 129 asientos y 10 extractos bancarios, cada uno con su respuesta correcta escrita antes de la medición. Cada punto es un caso:" data-en="The July test set has 129 entries and 10 bank statements, each with its correct answer written before the measurement. Each dot is a case:"></p>

      <div class="dot-grid-wrap">
        <div class="dot-grid" id="dotGrid"></div>
        <div class="dot-legend">
          <span class="dot-legend-item">
            <span class="dot-sample dot-sample-asiento"></span>
            <span data-es="129 asientos" data-en="129 entries"></span>
          </span>
          <span class="dot-legend-item">
            <span class="dot-sample dot-sample-ext"></span>
            <span data-es="10 extractos bancarios" data-en="10 bank statements"></span>
          </span>
        </div>
      </div>

      <p data-es="Los agentes funcionan con Claude Sonnet, de Anthropic, con Sonnet 4.6 desde el 21 de junio. Un corrector en Python compara su salida con la respuesta correcta y puntúa cinco cosas:" data-en="The agents run on Claude Sonnet, by Anthropic, on Sonnet 4.6 from 21 June. A Python grader compares their output with the correct answer and scores five things:"></p>
      <div class="axes-grid">
        <div class="axis">
          <div class="axis-weight">1</div>
          <div class="axis-name" data-es="La decisión" data-en="The decision"></div>
          <div class="axis-desc" data-es="¿Había que registrar el asiento o pararlo para revisión?" data-en="Should the entry be recorded or stopped for review?"></div>
        </div>
        <div class="axis">
          <div class="axis-weight">2</div>
          <div class="axis-name" data-es="El asiento exacto" data-en="The exact entry"></div>
          <div class="axis-desc" data-es="Cuentas e importes correctos" data-en="Correct accounts and amounts"></div>
        </div>
        <div class="axis">
          <div class="axis-weight">3</div>
          <div class="axis-name" data-es="El cuadre" data-en="The balance"></div>
          <div class="axis-desc" data-es="El debe y el haber suman lo mismo" data-en="Debits equal credits"></div>
        </div>
        <div class="axis">
          <div class="axis-weight">4</div>
          <div class="axis-name" data-es="El motivo de parar" data-en="The reason for stopping"></div>
          <div class="axis-desc" data-es="Si se para, que sea por la razón correcta" data-en="If it stops, it is for the right reason"></div>
        </div>
        <div class="axis">
          <div class="axis-weight">5</div>
          <div class="axis-name" data-es="La conciliación" data-en="The reconciliation"></div>
          <div class="axis-desc" data-es="Cada movimiento del banco casa con su asiento en la base de datos" data-en="Each bank movement matches its entry in the database"></div>
        </div>
      </div>

      <div class="eval-note" data-es="Los documentos, el asiento esperado y el movimiento bancario de cada caso salen de la misma ficha. Así el examen no puede quedar desfasado respecto a los datos." data-en="The document, the expected entry and the bank movement of each case come from the same record. That way the test set cannot drift away from the data."></div>
    </div>
  </section>

  <!-- RESULTADOS -->
  <section id="resultados" class="section">
    <div class="section-inner">
      <h2 data-es="Lo que sale" data-en="What comes out"></h2>
      <p data-es="Las cifras se midieron con la versión anterior del sistema, en la que un solo agente, el validador, revisaba y guardaba el asiento. Cada examen es distinto, así que las notas no se comparan entre sí." data-en="The figures were measured with the previous version of the system, in which a single agent, the validator, reviewed and saved the entry. Each test set is different, so the scores are not compared with each other."></p>

      <img src="assets/curva_runs.png" alt="Evolución de la nota en 23 mediciones, de mayo a julio de 2026" style="width: 100%; border-radius: 8px; border: 1px solid var(--border); margin: 1.5rem 0;" />

      <div class="lessons">
        <div class="lesson">
          <div class="lesson-run" data-es="Mayo · 63 casos" data-en="May · 63 cases"></div>
          <div class="lesson-text" data-es="La primera fase, con tres agentes, llegó a 97,0 sobre 100 en un examen de 63 casos." data-en="The first phase, with three agents, reached 97.0 out of 100 on a 63-case test set."></div>
        </div>
        <div class="lesson">
          <div class="lesson-run" data-es="Junio · 128 documentos" data-en="June · 128 documents"></div>
          <div class="lesson-text" data-es="Decisión correcta en 125 (97,7 %), asiento exacto en 81 de 84, cuadre en todos, motivo de parada correcto en 33 de 41 y conciliación correcta en 79 de 79. Ningún asiento erróneo registrado. La mejor nota de junio, 94,2 sobre 100, llegó el 27 de junio." data-en="Right decision in 125 (97.7%), exact entry in 81 of 84, balanced in all, right reason for stopping in 33 of 41 and correct reconciliation in 79 of 79. No wrong entry recorded. The best June score, 94.2 out of 100, came on 27 June."></div>
        </div>
        <div class="lesson">
          <div class="lesson-run" data-es="Julio · examen más grande" data-en="July · larger test set"></div>
          <div class="lesson-text" data-es="Con 129 asientos y 10 extractos, la nota es 79,4. Dos documentos se registraron cuando había que pararlos." data-en="With 129 entries and 10 statements, the score is 79.4. Two documents were recorded when they should have been stopped."></div>
        </div>
        <div class="lesson">
          <div class="lesson-run" data-es="Las caídas de la curva" data-en="The drops in the curve"></div>
          <div class="lesson-text" data-es="Las tres grandes (32,1, 35,4 y 57,1) vinieron de fallos del propio examen: un corrector que no leía la salida del validador, una ejecución que se cortó a mitad y unas respuestas correctas desfasadas respecto a la base de datos." data-en="The three big ones (32.1, 35.4 and 57.1) came from faults in the test itself: a grader that could not read the validator's output, a run that stopped halfway and expected answers out of step with the database."></div>
        </div>
      </div>
    </div>
  </section>

  <!-- LÍMITES -->
  <section id="limites" class="section section-dark">
    <div class="section-inner">
      <h2 data-es="Límites" data-en="Limits"></h2>
      <p data-es="Desde el repositorio no se puede ejecutar: los agentes trabajan sobre la base de datos privada de la empresa ficticia, y el criterio contable que sigue cada agente se queda en el proyecto privado. Lo que se publica es la medición." data-en="It cannot be run from the repository: the agents work on the fictitious company's private database, and the accounting criteria each agent follows stay in the private project. What is published is the measurement."></p>
      <div class="lessons">
        <div class="lesson">
          <div class="lesson-run" data-es="Lo que sigue fallando" data-en="What still fails"></div>
          <div class="lesson-text" data-es="Casos poco frecuentes, como la opción de compra de un leasing o un asiento de apertura. Parte del fallo es variabilidad del modelo." data-en="Rare cases, such as the purchase option of a lease or an opening entry. Part of the failure is model variability."></div>
        </div>
        <div class="lesson">
          <div class="lesson-run" data-es="Cuatro y cinco agentes" data-en="Four and five agents"></div>
          <div class="lesson-text" data-es="En septiembre de 2026 el validador se dividió en el verificador y el escribano. Lo medido es la versión anterior, de cuatro agentes." data-en="In September 2026 the validator was split into the verifier and the writer. What was measured is the previous, four-agent version."></div>
        </div>
        <div class="lesson">
          <div class="lesson-run" data-es="Ocho casos con la respuesta dentro" data-en="Eight cases with the answer inside"></div>
          <div class="lesson-text" data-es="En ocho casos sin documento el enunciado ya trae la respuesta: siete llevan el asiento escrito y uno dice que hay que pararlo. Esos ocho miden si el sistema copia bien, no su criterio." data-en="In eight cases without a document the prompt already contains the answer: seven carry the entry and one says it must be stopped. Those eight measure whether the system copies correctly, not its judgement."></div>
        </div>
        <div class="lesson">
          <div class="lesson-run" data-es="Un solo examen y una sola ejecución" data-en="One test set and one run"></div>
          <div class="lesson-text" data-es="Los arreglos se hicieron mirando el mismo examen, sin un lote de casos reservado. Cada nota sale de una sola ejecución. Falta compararlo con un solo agente y medir el coste." data-en="The fixes were made looking at the same test set, with no held-out batch of cases. Each score comes from a single run. A comparison with a single agent and a measure of cost are still missing."></div>
        </div>
      </div>
    </div>
  </section>
